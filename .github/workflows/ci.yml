name: CI

# Typecheck, tests and the lat.md parity gate on every push and pull request.
# The reference lat.md version is pinned: bump it deliberately and re-run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the reference lat.md for the parity suite
        run: npm install -g lat.md@0.12.2
      - run: npm run verify
